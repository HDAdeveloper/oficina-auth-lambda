name: CI/CD — auth-lambda

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # autenticar na AWS por OIDC (job de deploy)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Compila, testa, exige 80% de cobertura, gera o JAR da Lambda e analisa no SonarQube Cloud (se configurado)
  build-test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, testes e cobertura mínima (verify)
        run: ./mvnw -B verify

      - name: Resumo de cobertura na página da execução
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { m+=$8; c+=$9 } END { t=m+c; printf "### Cobertura de linhas: %.1f%% (%d de %d)\n\nMínimo exigido: 80%%.\n", (t==0?100:100*c/t), c, t }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Análise de qualidade (SonarQube Cloud)
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.exclusions=**/LocalServer.java
          -Dsonar.qualitygate.wait=true

      - name: Aviso — Sonar não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN ausente - analise do Sonar ignorada. Veja o README (Qualidade)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-testes-cobertura
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: auth-lambda-jar
          path: target/auth-lambda-1.0.0-SNAPSHOT.jar
          retention-days: 7

  # 2) Publica o novo código da função. Só na main, com DEPLOY_ENABLED=true e a função já criada (Terraform, Etapa 7).
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auth-lambda-jar
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Atualiza o código da Lambda
        run: |
          aws lambda update-function-code --function-name "${{ vars.LAMBDA_FUNCTION_NAME || 'oficina-auth-cpf' }}" \
            --zip-file fileb://auth-lambda-1.0.0-SNAPSHOT.jar
